apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp
  namespace: staging
spec:
  replicas: 6
  strategy:
    canary:
      stableService: myapp-stable
      canaryService: myapp-canary
      analysis:
        templates:
        - templateName: error-rate-check
        startingStep: 1
      steps:
      - setWeight: 10
      - pause: { duration: 2m }
      - setWeight: 25
      - pause: { duration: 2m }
      - setWeight: 50
      - pause: { duration: 2m }
      - setWeight: 100
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: myapp:stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
---
# Общий сервис, который балансирует между стабильными и канареечными подами
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: staging
spec:
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-stable
  namespace: staging
spec:
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary
  namespace: staging
spec:
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 3000